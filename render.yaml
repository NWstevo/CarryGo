databases:
  - name: carrygo-db
    databaseName: carrygo_app
    plan: free

services:
  - type: web
    name: carrygo-api
    runtime: node
    plan: free
    rootDir: apps/api
    buildCommand: npm install
    startCommand: npm start
    preDeployCommand: npm run migrate
    disk:
      name: uploads
      mountPath: /var/data/uploads
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: carrygo-db
          property: connectionString
      - key: UPLOADS_DIR
        value: /var/data/uploads
      # Set these in the Render dashboard after the blueprint is created —
      # not read from this file, so nothing sensitive lives in the repo.
      - key: JWT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      # Paste in the carrygo-web static site's URL once it's live (see below).
      - key: FRONTEND_URL
        sync: false

  - type: static
    name: carrygo-web
    plan: free
    rootDir: apps/web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Paste in the carrygo-api web service's URL + /api once it's live.
      - key: VITE_API_URL
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
      - key: VITE_APP_NAME
        value: CarryGo
